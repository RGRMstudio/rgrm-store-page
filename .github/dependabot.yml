version: 2
updates:
  # Maintain dependencies for npm (Next.js, Stripe, Loops, Printful)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily" # Daily checks for high-security environments
    open-pull-requests-limit: 10
    
    # Ensure RGRMstudio is assigned to all security PRs
    assignees:
      - "RGRMstudio"
    
    # Grouping strategy to reduce notification noise
    groups:
      dependencies:
        patterns:
          - "*"
        dependency-type: "production"
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"

    # Specific labels to help you identify PRs quickly
    labels:
      - "security"
      - "dependencies"
      - "RGRM-Registry-Update"
